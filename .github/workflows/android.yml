
name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mafiflow_mobile --org com.mafistudio .

      - name: Enable Internet permission
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(text)

          assert 'android.permission.INTERNET' in manifest.read_text()
          print('Android Internet permission enabled')
          PYANDROID

      - name: Remove generated example test
        run: rm -f test/widget_test.dart

      - name: Install packages
        run: flutter pub get

      - name: Set Android application name
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="MafiFlow"',
              text,
              count=1
          )

          assert count == 1, 'Android app label not found'
          manifest.write_text(text)
          print('Application name: MafiFlow')
          PYANDROID

      - name: Generate official app icon
        run: |
          dart run flutter_launcher_icons

      - name: Verify app configuration
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()

          assert 'android:label="MafiFlow"' in manifest
          assert 'android.permission.INTERNET' in manifest

          icons = list(Path('android/app/src/main/res').rglob('*launcher*.png'))
          assert icons, 'No launcher icons generated'

          print('App name verified: MafiFlow')
          print('Internet permission verified')
          print('App icon verified')
          PYANDROID

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MafiFlow-1.0-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MafiFlow-1.0-Android-Release
          path: MafiFlow-1.0-Android.apk
          if-no-files-found: error
